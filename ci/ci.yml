# GitHub Actions workflow. To enable it, move this file to .github/workflows/ci.yml
# (pushing workflow files needs a token with the `workflow` scope, e.g. `gh auth refresh -s workflow`).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx streamdeck validate com.gabrielvaz.coding-agents.sdPlugin --no-update-check
      - run: npx streamdeck pack com.gabrielvaz.coding-agents.sdPlugin --output dist --force --no-update-check
      - uses: actions/upload-artifact@v4
        with:
          name: com.gabrielvaz.coding-agents.streamDeckPlugin
          path: dist/com.gabrielvaz.coding-agents.streamDeckPlugin
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/com.gabrielvaz.coding-agents.streamDeckPlugin
          generate_release_notes: true
