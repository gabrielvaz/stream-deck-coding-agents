<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coding Agents</title>
    <style>
      body { margin: 0; padding: 10px 14px; background: #2d2d2d; color: #d8d8d8; font: 13px/1.4 -apple-system, "Segoe UI", sans-serif; }
      label { display: block; margin: 10px 0 4px; color: #9a9a9a; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      input, select { width: 100%; box-sizing: border-box; background: #1f1f1f; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 6px 8px; font-size: 13px; }
      p { margin: 8px 0; color: #9a9a9a; }
      code { color: #ccc; }
      .ok { color: #35e3a2; } .bad { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div id="session-only">
      <label for="slot">Session slot</label>
      <select id="slot">
        <option value="auto">Auto (by position on the deck)</option>
        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
        <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
        <option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option>
      </select>
      <p>Sessions are ordered: waiting for you → working → just finished → idle. Slot 1 is the most urgent.</p>
    </div>
    <label for="url">Agent Deck server</label>
    <input id="url" placeholder="http://127.0.0.1:7777" />
    <label for="token">Token (from <code>agent-deck token</code>)</label>
    <input id="token" type="password" placeholder="leave empty to read ~/.agent-deck/config.json" />
    <p id="status">…</p>
    <script>
      let ws, uuid, actionInfo, settings = {}, globalSettings = {};
      const $ = (id) => document.getElementById(id);
      window.connectElgatoStreamDeckSocket = (port, pluginUUID, registerEvent, info, actionInfoJson) => {
        uuid = pluginUUID;
        actionInfo = JSON.parse(actionInfoJson);
        settings = actionInfo.payload.settings || {};
        $("session-only").style.display = actionInfo.action.endsWith(".session") ? "block" : "none";
        $("slot").value = settings.slot || "auto";
        ws = new WebSocket("ws://127.0.0.1:" + port);
        ws.onopen = () => {
          ws.send(JSON.stringify({ event: registerEvent, uuid }));
          ws.send(JSON.stringify({ event: "getGlobalSettings", context: uuid }));
        };
        ws.onmessage = (m) => {
          const msg = JSON.parse(m.data);
          if (msg.event === "didReceiveGlobalSettings") {
            globalSettings = msg.payload.settings || {};
            $("url").value = globalSettings.url || "";
            $("token").value = globalSettings.token || "";
          }
          if (msg.event === "sendToPropertyInspector" && msg.payload && msg.payload.status) {
            $("status").textContent = msg.payload.status;
            $("status").className = msg.payload.ok ? "ok" : "bad";
          }
        };
      };
      $("slot").addEventListener("change", () => {
        settings.slot = $("slot").value;
        ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
      });
      const saveGlobal = () => {
        globalSettings.url = $("url").value.trim();
        globalSettings.token = $("token").value.trim();
        ws.send(JSON.stringify({ event: "setGlobalSettings", context: uuid, payload: globalSettings }));
      };
      $("url").addEventListener("change", saveGlobal);
      $("token").addEventListener("change", saveGlobal);
    </script>
  </body>
</html>
